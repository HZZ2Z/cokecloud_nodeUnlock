<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>正在加载，请稍后</title>
</head>
<body>
  <a id="redirect-link" href="https://keleb.ih004.com/">正在加载，请稍后</a>
  <script>
    (function () {
      var target = new URL("https://keleb.ih004.com/", window.location.href);
      if ( true  && window.location.hash) {
        target.hash = window.location.hash;
      }
      var destination = target.href;
      document.getElementById('redirect-link').href = destination;
      window.setTimeout(function () {
        window.location.replace(destination);
      },  0 );
    }());
  </script>
  <noscript>
    <meta http-equiv="refresh" content="0;url=https://keleb.ih004.com/">
  </noscript>
</body>
</html>
